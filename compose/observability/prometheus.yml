global:
  scrape_interval: 5s
scrape_configs:
  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["auth:9090"] }]
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api:9090"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: mysqld
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]
