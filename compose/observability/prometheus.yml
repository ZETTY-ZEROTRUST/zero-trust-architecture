global:
  scrape_interval: 5s
# 앱은 인스턴스를 늘릴 수 있으므로 Docker DNS(A 레코드)로 모든 인스턴스를 찾아 수집한다.
scrape_configs:
  - job_name: auth
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: ["auth"], type: A, port: 9090, refresh_interval: 10s }]
  - job_name: api
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: ["api"], type: A, port: 9090, refresh_interval: 10s }]
  - job_name: bff
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: ["bff"], type: A, port: 9090, refresh_interval: 10s }]
  - job_name: outbox-relay
    dns_sd_configs: [{ names: ["outbox-relay"], type: A, port: 9101, refresh_interval: 10s }]
  - job_name: event-indexer
    dns_sd_configs: [{ names: ["event-indexer"], type: A, port: 9102, refresh_interval: 10s }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: mysqld
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]
