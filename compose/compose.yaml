name: zetty

# core: AWS 없이 기동하는 인증 기반. observability: 부하 측정용 관측.
# backend 저장소는 형제 디렉터리로 checkout한다고 가정한다(BACKEND_PATH로 재지정 가능).

services:
  kms:
    image: nsmithuk/local-kms@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
    environment:
      PORT: "8080"
      KMS_REGION: ap-northeast-2
    volumes:
      - kms-data:/data
    networks: [kms]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--post-data={}",
             "--header=X-Amz-Target: TrentService.ListKeys",
             "--header=Content-Type: application/x-amz-json-1.1", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  kms-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./kms-seed/init.sh:/init/init.sh:ro
    networks: [kms]
    depends_on:
      kms: { condition: service_healthy }
    restart: "no"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zeti_db
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.secrets/mysql-init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  redis-session:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [application]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  auth:
    build:
      context: ${BACKEND_PATH:-../../backend}/auth-server
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zeti_db
      DB_USERNAME: auth_app
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      ZETTY_KMS_ENDPOINT: http://kms:8080
      ZETTY_KMS_REGION: ap-northeast-2
      ZETTY_JWT_KMS_KEY_ID: alias/zetty-jwt-signing
      REDIS_HOST: ${REDIS_HOST:-redis-session}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      EVENT_HMAC_KEY: ${EVENT_HMAC_KEY}
    networks: [application, data, kms]
    depends_on:
      mysql: { condition: service_healthy }
      kms-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
    deploy:
      resources:
        limits: { cpus: "2", memory: 768M }

  api:
    build:
      context: ${BACKEND_PATH:-../../backend}/api-server
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zeti_db
      DB_USERNAME: api_app
      DB_PASSWORD: ${API_DB_PASSWORD}
      ZETTY_JWKS_URI: http://auth:8080/.well-known/jwks.json
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONN_TIMEOUT_MS: ${DB_CONN_TIMEOUT_MS:-5000}
      REDIS_HOST: ${REDIS_HOST:-redis-session}
      ZETTY_AUTHSTATE_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL:-30}
      ZETTY_MYPAGE_CACHE_ENABLED: ${MYPAGE_CACHE:-false}
      ZETTY_MYPAGE_CACHE_TTL_SECONDS: ${MYPAGE_CACHE_TTL:-60}
      JAVA_OPTS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=75}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-400}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX:-200}
      # API 문서는 로컬 전용. 운영 배포에서는 false로 둔다.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      EVENT_HMAC_KEY: ${EVENT_HMAC_KEY}
    networks: [application, data]
    depends_on:
      mysql: { condition: service_healthy }
      auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
    deploy:
      resources:
        limits: { cpus: "2", memory: 768M }


  # BFF: 브라우저는 세션 쿠키만 받고 AT/RT는 BFF의 암호화 vault(MySQL)에만 둔다.
  bff:
    build:
      context: ${BACKEND_PATH:-../../backend}/bff-server
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zeti_db
      DB_USERNAME: bff_app
      DB_PASSWORD: ${BFF_DB_PASSWORD}
      BFF_VAULT_KEY: ${BFF_VAULT_KEY}
      REDIS_HOST: ${REDIS_HOST:-redis-session}
      AUTH_BASE_URL: http://auth:8080
      API_BASE_URL: http://api:8081
      BFF_ALLOWED_ORIGIN: https://127.0.0.1:8443
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-400}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    networks: [application, data]
    depends_on:
      mysql: { condition: service_healthy }
      redis-session: { condition: service_healthy }
      auth: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
    deploy:
      resources:
        limits: { cpus: "2", memory: 768M }

  # ---- analysis profile: 보안 이벤트 전달(Outbox → Redis Streams → ES) ----
  redis-events:
    image: redis:7-alpine
    profiles: [analysis]
    # 세션 Redis와 분리. AOF로 내구성, noeviction으로 조용한 유실 방지. ACL 사용자별 최소 권한(default 사용자 끔).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--aclfile", "/etc/redis/users.acl"]
    volumes:
      - redis-events-data:/data
      - ./.secrets/redis-events/users.acl:/etc/redis/users.acl:ro
    networks: [analysis]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "--user", "healthcheck", "--pass", "x", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.14
    profiles: [analysis]
    environment:
      discovery.type: single-node
      # 로컬 전용(host 포트 미공개, analysis 네트워크만). 운영에서는 보안 기능을 켜고 indexer에 최소 권한 키를 준다.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [analysis]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536M }

  outbox-relay:
    build:
      context: ${LOG_PIPELINE_PATH:-../../log-pipeline}
      dockerfile: pipeline/relay/Dockerfile
    profiles: [analysis]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: zetty_relay
      MYSQL_PASSWORD_FILE: /run/secrets/relay_db
      REDIS_EVENTS_HOST: redis-events
      REDIS_EVENTS_USERNAME: zetty-relay
      REDIS_EVENTS_PASSWORD_FILE: /run/secrets/redis_relay
    secrets: [relay_db, redis_relay]
    networks: [data, analysis]
    depends_on:
      mysql: { condition: service_healthy }
      redis-events: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  event-indexer:
    build:
      context: ${LOG_PIPELINE_PATH:-../../log-pipeline}
      dockerfile: pipeline/indexer/Dockerfile
    profiles: [analysis]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: zetty_indexer
      MYSQL_PASSWORD_FILE: /run/secrets/indexer_db
      REDIS_EVENTS_HOST: redis-events
      REDIS_EVENTS_USERNAME: zetty-indexer
      REDIS_EVENTS_PASSWORD_FILE: /run/secrets/redis_indexer
      ES_URL: http://elasticsearch:9200
      ES_ENSURE_TEMPLATE: "true"
    secrets: [indexer_db, redis_indexer]
    networks: [data, analysis]
    depends_on:
      mysql: { condition: service_healthy }
      redis-events: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # S3 lab: 공격자가 KMS Sign 권한을 얻은 상황 재현(대장 미기록 위조 토큰 발급).
  # profiles:[lab]로 기본 기동에서 제외. 127.0.0.1에만 노출, 별도 프로필로만 실행.
  auth-lab:
    build:
      context: ${BACKEND_PATH:-../../backend}/auth-server
      dockerfile: Dockerfile
    profiles: [lab]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zeti_db
      DB_USERNAME: auth_app
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      ZETTY_KMS_ENDPOINT: http://kms:8080
      ZETTY_JWT_KMS_KEY_ID: alias/zetty-jwt-signing
      SPRING_PROFILES_ACTIVE: lab
    ports:
      - "127.0.0.1:8444:8080"
    networks: [application, data, kms]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [application]
    depends_on:
      auth: { condition: service_healthy }
      api: { condition: service_healthy }
      bff: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 128M }


  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [application, data]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [observability]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [application]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    profiles: [observability]
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    networks: [data]
    depends_on:
      mysql: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

secrets:
  relay_db: { file: ./.secrets/files/relay_db }
  indexer_db: { file: ./.secrets/files/indexer_db }
  redis_relay: { file: ./.secrets/files/redis_relay }
  redis_indexer: { file: ./.secrets/files/redis_indexer }

networks:
  analysis: {}
  edge: {}
  application: {}
  data: {}
  kms: {}

volumes:
  mysql-data: {}
  kms-data: {}
  redis-events-data: {}
  es-data: {}
