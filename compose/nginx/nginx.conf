worker_processes auto;
events { worker_connections 4096; }
http {
    access_log off;
    upstream auth_up { server auth:8080; keepalive 32; }
    upstream api_up  { server api:8081;  keepalive 32; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name zetty.localhost;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # 클라이언트가 보낸 신뢰 헤더를 제거하고 edge가 다시 만든다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        location /auth/    { proxy_pass http://auth_up; }
        location /.well-known/jwks.json { proxy_pass http://auth_up; }
        location /         { proxy_pass http://api_up; }
    }
}
