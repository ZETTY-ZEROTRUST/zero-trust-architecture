worker_processes auto;
events { worker_connections 4096; }
http {
    access_log off;
    upstream auth_up { server auth:8080; keepalive 32; }
    upstream api_up  { server api:8081;  keepalive 32; }
    upstream bff_up  { server bff:8082;  keepalive 32; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name zetty.localhost;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # 클라이언트가 보낸 신뢰 헤더를 제거하고 edge가 다시 만든다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        # location 안에서 proxy_set_header를 하나라도 쓰면 여기 값들이 상속되지 않는다(Host가 upstream 이름 bff_up으로 나가 Tomcat 400).
        # 공통 헤더는 server 수준에만 둔다.
        proxy_set_header X-Forwarded-Proto https;

        # 브라우저 진입점. BFF가 세션 쿠키·CSRF를 처리하고 API에는 서버 측에서 AT를 붙인다.
        location /bff/     { proxy_pass http://bff_up; }
        location /auth/    { proxy_pass http://auth_up; }
        location /.well-known/jwks.json { proxy_pass http://auth_up; }
        location /         { proxy_pass http://api_up; }
    }
}
