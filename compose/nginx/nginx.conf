worker_processes auto;
events { worker_connections 4096; }
http {
    access_log off;

    # 로그인 과부하 방어: BCrypt(cost 10) CPU 한계로 auth 1대당 약 24 TPS(L-05 실측).
    # 한계를 넘는 요청은 줄 세우지 않고 즉시 429로 거절해, 받아들인 요청의 지연을 지킨다.
    # 브라우저(/bff/login)와 직접(/auth/login) 두 진입점을 같은 구역으로 묶는다.
    # 22r/s = 실측 한계(24 TPS)보다 약간 낮게. 인스턴스 수를 바꾸면 이 값을 다시 맞춘다(auth 2대면 약 44r/s). 계정별 무차별 대입 방어는 auth 앱(Redis)에서 따로 한다.
    limit_req_zone $server_name zone=login_global:1m rate=22r/s;
    limit_req_status 429;
    # 로드 밸런서: Docker DNS(127.0.0.11)를 5초마다 다시 조회해 인스턴스 증감을 reload 없이 반영한다(nginx 1.27.3+ 오픈소스 resolve).
    # 앱은 상태를 DB·Redis에 두므로 sticky 세션 없이 라운드 로빈. 연속 실패한 인스턴스는 10초간 제외(수동 헬스 체크).
    # POST 등 비멱등 요청은 기본적으로 다른 인스턴스로 재시도하지 않는다(로그인 중복 발급 방지).
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream auth_up { zone auth_up 64k; server auth:8080 resolve max_fails=2 fail_timeout=10s; keepalive 32; }
    upstream api_up  { zone api_up 64k;  server api:8081  resolve max_fails=2 fail_timeout=10s; keepalive 32; }
    upstream bff_up  { zone bff_up 64k;  server bff:8082  resolve max_fails=2 fail_timeout=10s; keepalive 32; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name zetty.localhost;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # 클라이언트가 보낸 신뢰 헤더를 제거하고 edge가 다시 만든다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        # location 안에서 proxy_set_header를 하나라도 쓰면 여기 값들이 상속되지 않는다(Host가 upstream 이름 bff_up으로 나가 Tomcat 400).
        # 공통 헤더는 server 수준에만 둔다.
        proxy_set_header X-Forwarded-Proto https;
        # upstream keepalive가 실제로 동작하려면 HTTP/1.1 + Connection 헤더 제거가 필요하다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 브라우저 진입점. BFF가 세션 쿠키·CSRF를 처리하고 API에는 서버 측에서 AT를 붙인다.
        location = /bff/login  { limit_req zone=login_global burst=10 nodelay; proxy_pass http://bff_up; }
        location = /auth/login { limit_req zone=login_global burst=10 nodelay; proxy_pass http://auth_up; }
        location /bff/     { proxy_pass http://bff_up; }
        location /auth/    { proxy_pass http://auth_up; }
        location /.well-known/jwks.json { proxy_pass http://auth_up; }
        location /         { proxy_pass http://api_up; }
    }
}
